name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (fail on high+)
        run: npm run audit:deps

      - name: Run tests
        run: npm test

      - name: Accessibility smoke + axe (WCAG AA baseline)
        run: npm run test:a11y

      - name: Ledger query SLO smoke
        run: npm run test:load

      - name: P0 demo dry-run
        run: npm run demo:p0

      - name: Build
        run: npm run build
